version: "3.8"

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html/static:ro
    depends_on:
      - node-backend
    restart: unless-stopped

  node-backend:
    build: ./node-backend
    env_file:
      - .env
    depends_on:
      - python-service
    restart: unless-stopped

  python-service:
    build: ./python-service
    env_file:
      - .env
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:14-alpine
    # SECURITY FIX [SEC-003]: Database credentials are no longer hardcoded.
    # They are read from the .env file (which must be git-ignored).
    # Generate a strong password and set POSTGRES_USER / POSTGRES_PASSWORD in .env.
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-company_website}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./python-service/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    restart: unless-stopped

volumes:
  pgdata:

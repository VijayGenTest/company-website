worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Security Headers ──────────────────────────────────────────────────
    add_header X-Frame-Options          "SAMEORIGIN"                       always;
    add_header X-XSS-Protection         "1; mode=block"                    always;
    add_header X-Content-Type-Options   "nosniff"                          always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin"  always;
    # SECURITY FIX [SEC-007]: HSTS header — tells browsers to always use HTTPS.
    # Enable only after TLS is confirmed working to avoid locking out HTTP access.
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # ── PERF FIX [PERF-004]: Enable gzip compression ──────────────────────
    # Reduces CSS/JS/HTML transfer size by 60-80%, improving Time-to-First-Byte.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml
        font/woff2
        application/xml;

    # ── Rate limiting zone ────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=contact_api:10m rate=10r/m;

    # ── HTTP server ───────────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # SECURITY FIX [SEC-007]: Redirect all HTTP to HTTPS in production.
        # Uncomment and configure once TLS certificates are provisioned.
        # return 301 https://$host$request_uri;

        # Static pages
        location / {
            root /usr/share/nginx/html/static;
            try_files $uri $uri.html $uri/ /404.html;
        }

        # PERF FIX [PERF-005]: Cache static assets with long-lived Cache-Control.
        # CSS/JS/images are fingerprinted at build time so immutable is safe.
        location ~* \.(css|js|woff2|woff|ttf|png|jpg|jpeg|gif|svg|ico)$ {
            root    /usr/share/nginx/html/static;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
        }

        # API proxy with rate limiting
        location /api/ {
            limit_req zone=contact_api burst=5 nodelay;
            proxy_pass http://node-backend:3000;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /health {
            proxy_pass http://node-backend:3000;
        }

        error_page 404 /404.html;
    }

    # ── HTTPS server (SECURITY FIX [SEC-007]) ────────────────────────────
    # Uncomment this block after provisioning TLS certificates (e.g. Let's Encrypt).
    #
    # server {
    #     listen 443 ssl http2;
    #     server_name yourdomain.com;
    #
    #     ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
    #     ssl_prefer_server_ciphers on;
    #
    #     add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    #
    #     location / {
    #         root /usr/share/nginx/html/static;
    #         try_files $uri $uri.html $uri/ /404.html;
    #     }
    #
    #     location ~* \.(css|js|woff2|woff|ttf|png|jpg|jpeg|gif|svg|ico)$ {
    #         root    /usr/share/nginx/html/static;
    #         expires 30d;
    #         add_header Cache-Control "public, max-age=2592000, immutable";
    #     }
    #
    #     location /api/ {
    #         limit_req zone=contact_api burst=5 nodelay;
    #         proxy_pass http://node-backend:3000;
    #         proxy_set_header Host              $host;
    #         proxy_set_header X-Real-IP         $remote_addr;
    #         proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto $scheme;
    #     }
    #
    #     location /health {
    #         proxy_pass http://node-backend:3000;
    #     }
    #
    #     error_page 404 /404.html;
    # }
}
